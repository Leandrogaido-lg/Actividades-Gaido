<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>
    <header class="encabezado-principal">
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/logo_rs.svg" alt="Retiro Sustentable">
        </a>
        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Reservas</h1>
       
        <h2>Contactanos</h2>

       
        <form action="./reservas.html" method="post">
            <label for="id-nombre">Nombre de la persona que consulta</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">Teléfono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-email">Email</label>
            <input type="email" name="email" id="id-email">

            <label for="id-fecha-desde">Fecha desde</label>
            <input type="date" name="fecha-desde" id="id-fecha-desde">

            <label for="id-fecha-hasta">Fecha hasta</label>
            <input type="date" name="fecha-hasta" id="id-fecha-hasta">

            <label for="id-comentario">Comentario</label>
            <textarea name="comentario" id="id-comentario"></textarea>

            <button type="reset">Limpiar</button>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer class="pie-principal">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
